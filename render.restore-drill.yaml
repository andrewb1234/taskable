# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: cron
    name: mouvadah-monthly-restore-drill
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 6 1 * *"
    autoDeployTrigger: checksPass
    dockerfilePath: ./docker/Dockerfile.backup
    dockerContext: .
    dockerCommand: /app/scripts/restore_drill_from_s3.sh
    envVars:
      - key: RESTORE_DRILL_DATABASE_URL
        sync: false
      - key: RESTORE_DRILL_CONFIRM_DATABASE
        value: mouvadah_restore_drill
      - key: RESTORE_DRILL_PROTECTED_DATABASE_FINGERPRINT
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: mouvadah/database
      - key: BACKUP_S3_KMS_KEY_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
