name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag and build MCP artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("mcp/pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(
                  f"tag {os.environ['RELEASE_TAG']} does not match MCP version {version}"
              )
          PY
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build --outdir release-assets mcp
          python -m twine check release-assets/*

      - name: Validate installer and Compose manifest
        env:
          JWT_SECRET: release-validation-only
          MOUVADAH_CONFIG_DIR: /tmp/mouvadah-config
          MOUVADAH_DATA_DIR: /tmp/mouvadah-data
        run: |
          sh -n packaging/mouvadah
          docker compose -f docker/compose.release.yml config >/dev/null

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Prepare image metadata
        id: images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          {
            echo "version=$version"
            echo "api_tags<<EOF"
            echo "ghcr.io/andrewb1234/mouvadah-api:$version"
            echo "ghcr.io/andrewb1234/mouvadah-api:latest"
            echo "EOF"
            echo "web_tags<<EOF"
            echo "ghcr.io/andrewb1234/mouvadah-web:$version"
            echo "ghcr.io/andrewb1234/mouvadah-web:latest"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build and publish API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.api_tags }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.images.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.web_tags }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.images.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Assemble checksummed release
        run: |
          cp docker/compose.release.yml release-assets/compose.yml
          cp packaging/mouvadah release-assets/mouvadah
          chmod +x release-assets/mouvadah
          printf '%s\n' "${GITHUB_REF_NAME#v}" > release-assets/VERSION
          cp LICENSE release-assets/LICENSE
          cp mcp/LICENSE release-assets/MCP-LICENSE
          cp mcp/NOTICE release-assets/MCP-NOTICE
          cp NOTICE TRADEMARKS.md THIRD_PARTY_NOTICES.md release-assets/
          (
            cd release-assets
            sha256sum * > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --generate-notes \
            --title "Mouvadah ${{ github.ref_name }}"

  pypi:
    name: Publish MCP package to PyPI
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate MCP artifacts
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build mcp
          python -m twine check mcp/dist/*

      - name: Publish MCP package
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: mcp/dist/
