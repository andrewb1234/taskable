version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Tokyo
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Tokyo
    groups:
      mcp-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Asia/Tokyo
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
